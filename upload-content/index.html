<!DOCTYPE html>
<html id="htmlTag" lang="en">
  <script>
    //Script for multilingual support 
    const $htmlTag = document.querySelector("#htmlTag")
    switch(navigator.language.substring(0,2)) {
      case "es":
        $htmlTag.lang = "es"
        $htmlTag.classList.add("spanishLang")
        break
      default:
        $htmlTag.classList.add("englishLang")
        break
    }
  </script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload to Utonoma</title>
  <meta
    name="description"
    content="Utonoma is a decentralized social network where creators can publish short videos, earn crypto rewards, and own their content."
  >
  <link rel="preload" href="/assets/fonts/noto-sans-variable-subset.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

          d="M1.7 17L0 15.3L6.8 8.5L0 1.7L1.7 0L8.5 6.8L15.3 0L17 1.7L10.2 8.5L17 15.3L15.3 17L8.5 10.2L1.7 17Z" 
          fill="currentColor"
        />
      </svg>
      <span lang="en">BACK</span>
      <span lang="es">ATRAS</span>
    </button>
  </div>
</body>
</html>
